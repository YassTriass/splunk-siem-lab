# Splunk Universal Forwarder (Windows 10 VM)
# Location: C:\Program Files\SplunkUniversalForwarder\etc\system\local\inputs.conf

[WinEventLog://Application]
disabled = 0
index = windows

[WinEventLog://Security]
disabled = 0
index = windows

[WinEventLog://System]
disabled = 0
index = windows

# Requires the forwarder service account (NT SERVICE\SplunkForwarder)
# to be a member of the "Event Log Readers" group, otherwise error code 5.
[WinEventLog://Microsoft-Windows-Sysmon/Operational]
disabled = 0
index = windows
# XML format is required by the Splunk Add-on for Sysmon (installed on the Splunk server).
# With renderXml on, events are searched under the XmlWinEventLog source below.
renderXml = 1
source = XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
