# Splunk Universal Forwarder (Windows 10 VM)
# Location: C:\Program Files\SplunkUniversalForwarder\etc\system\local\outputs.conf
# Replace <SPLUNK_SERVER_IP> with the Splunk Enterprise server (Ubuntu VM).
# 9997 is the receiving port enabled on the server.

[tcpout]
defaultGroup = default-autolb-group

[tcpout:default-autolb-group]
server = <SPLUNK_SERVER_IP>:9997

[tcpout-server://<SPLUNK_SERVER_IP>:9997]
