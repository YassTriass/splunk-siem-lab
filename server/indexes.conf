# Splunk Enterprise (Ubuntu Server VM)
# Location: /opt/splunk/etc/apps/search/local/indexes.conf

[windows]
coldPath = $SPLUNK_DB/windows/colddb
homePath = $SPLUNK_DB/windows/db
# Maximum size of the whole index. When it is exceeded, Splunk removes the oldest
# buckets. The default is 500000 MB, more than this VM's disk.
maxTotalDataSizeMB = 5000
thawedPath = $SPLUNK_DB/windows/thaweddb
